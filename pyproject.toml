[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uq-mace"
version = "0.1.0"
description = "Uncertainty quantification for MACE interatomic potentials, applied to water"
authors = [{name = "Emil Ohligs"}]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
